<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--blue:#1A4DB3;--gold:#F5A800;--gold-d:#C98C00}
    [data-theme="dark"]{--bg:#0e1c2f;--surface:#152438;--card:#1a2e45;--border:#243d58;--text:#e8f0fb;--muted:#7a9ab8}
    [data-theme="light"]{--bg:#f0f4fb;--surface:#fff;--card:#fff;--border:#c8d8ee;--text:#0d1b2e;--muted:#5a7a9e}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:.2s}
    .layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
    aside{background:var(--surface);padding:24px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
    aside h2{font-size:18px;font-weight:700;color:var(--gold);margin-bottom:4px}
    aside p{font-size:12px;color:var(--muted);margin-bottom:12px}
    .nav a{display:block;color:var(--muted);text-decoration:none;padding:9px 12px;border-radius:8px;margin-bottom:4px;font-size:14px;font-weight:500;transition:.15s;border:1px solid transparent;cursor:pointer}
    .nav a:hover{background:var(--card);color:var(--text);border-color:var(--border)}
    .nav a.active{background:var(--blue);color:#fff;border-color:var(--blue)}
    .sidebar-foot{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
    main{padding:28px 32px;background:var(--bg)}
    h1{font-size:24px;font-weight:700;margin-bottom:4px}
    .subtitle{color:var(--muted);font-size:14px;margin-bottom:24px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
    .card h3{font-size:15px;font-weight:600;margin-bottom:16px;color:var(--gold)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
    label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
    input,textarea,select{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:14px;margin-bottom:12px;outline:none;transition:.15s}
    input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(245,168,0,.15)}
    input[type="checkbox"]{width:auto;margin:0;padding:0;accent-color:var(--gold)}
    textarea{min-height:90px;resize:vertical}
    button{padding:9px 16px;border:none;border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
    .btn-gold{background:var(--gold);color:#0d1b2e}.btn-gold:hover{background:var(--gold-d)}
    .btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{filter:brightness(1.15)}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}.btn-ghost:hover{border-color:var(--gold);color:var(--text)}
    .btn-danger{background:transparent;border:1px solid #e05252;color:#e05252}.btn-danger:hover{background:rgba(224,82,82,.1)}
    .btn-sm{padding:6px 12px;font-size:13px}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .badge{display:inline-block;padding:2px 9px;border-radius:999px;background:rgba(26,77,179,.25);color:#7aadff;font-size:11px;font-weight:600;border:1px solid rgba(26,77,179,.4)}
    .item{border:1px solid var(--border);border-radius:9px;padding:12px;margin-bottom:8px;background:var(--bg)}
    .msg{display:none;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:14px;font-weight:500}
    .msg.show{display:block}
    .success{background:rgba(16,185,100,.12);color:#10b964;border:1px solid rgba(16,185,100,.25)}
    .error{background:rgba(224,82,82,.12);color:#e05252;border:1px solid rgba(224,82,82,.25)}
    .cb-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
    .cb-label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0;padding:6px 10px;border:1px solid var(--border);border-radius:7px;cursor:pointer}
    .page{display:none}.page.active{display:block}
    @media(max-width:800px){.layout{grid-template-columns:1fr}aside{border-right:none;border-bottom:1px solid var(--border)}}
  </style>
</head>
<body>
<div class="layout">
  <aside>
    <div>
      <h2>Company Portal</h2>
      <p>Manage projects, shortlists &amp; intern reports.</p>
    </div>
    <div class="nav">
      <a onclick="navigate('overview')" id="nav-overview" class="active">Overview</a>
      <a onclick="navigate('projects')" id="nav-projects">Projects</a>
      <a onclick="navigate('shortlist')" id="nav-shortlist">Shortlist</a>
      <a onclick="navigate('reports')" id="nav-reports">Weekly Reports</a>
    </div>
    <div class="sidebar-foot">
      <button class="btn-ghost btn-sm" onclick="toggleTheme()" id="themeBtn">&#9728; Light mode</button>
      <button class="btn-ghost btn-sm" onclick="logout()">Sign out</button>
    </div>
  </aside>

  <main>
    <div id="msg" class="msg"></div>
    <h1 id="pageTitle">Overview</h1>
    <p class="subtitle" id="pageSubtitle">Your company at a glance.</p>

    
    <div id="page-overview" class="page active">
      <div class="grid">
        <div class="card"><h3>Company</h3><div id="profileBox" style="color:var(--muted)">Loading...</div></div>
        <div class="card"><h3>Counts</h3><div id="countBox" style="color:var(--muted)">Loading...</div></div>
      </div>
    </div>

    
    <div id="page-projects" class="page">
      <div class="grid">
        <div class="card">
          <h3>Create Project</h3>
          <form id="projectForm">
            <label>Project Name</label>
            <input id="project_name" required>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
              <div><label>No. of Interns</label><input id="number_of_interns" type="number" required></div>
              <div><label>Stipend</label><input id="stipend" type="number" step="0.01"></div>
            </div>
            <label>Description</label><textarea id="description"></textarea>
            <label>Details</label><textarea id="details"></textarea>
            <label style="margin-bottom:8px">Options</label>
            <div class="cb-row">
              <label class="cb-label"><input type="checkbox" id="place_of_work"> On-site</label>
              <label class="cb-label"><input type="checkbox" id="international_students"> International</label>
              <label class="cb-label"><input type="checkbox" id="hired_after"> Hire after</label>
              <label class="cb-label"><input type="checkbox" id="covid_vaccination"> Vaccination</label>
            </div>
            <button type="submit" class="btn-gold" style="width:100%">Create Project</button>
          </form>
        </div>
        <div class="card">
          <div class="row" style="justify-content:space-between;margin-bottom:16px">
            <h3 style="margin:0">My Projects</h3>
            <button class="btn-ghost btn-sm" onclick="loadProjects()">&#8635; Refresh</button>
          </div>
          <div id="projectsList" style="color:var(--muted)">Loading...</div>
        </div>
      </div>
    </div>

    
    <div id="page-shortlist" class="page">
      <div class="card">
        <div class="row" style="justify-content:space-between;margin-bottom:16px">
          <h3 style="margin:0">Shortlisted Students</h3>
          <button class="btn-ghost btn-sm" onclick="loadShortlist()">&#8635; Refresh</button>
        </div>
        <div id="shortlistList" style="color:var(--muted)">Loading...</div>
      </div>
    </div>

   
    <div id="page-reports" class="page">
      <div class="card">
        <div class="row" style="justify-content:space-between;margin-bottom:16px">
          <h3 style="margin:0">Weekly Reports</h3>
          <button class="btn-ghost btn-sm" onclick="loadReports()">&#8635; Refresh</button>
        </div>
        <div id="reportsList" style="color:var(--muted)">Loading...</div>
      </div>
    </div>
  </main>
</div>

<script>
  const token = localStorage.getItem('company_token');

  function authHeaders() {
    return token ? { 'Authorization': 'Bearer ' + token } : {};
  }

  function showMsg(text, type = 'success') {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg show ' + type;
    setTimeout(() => el.className = 'msg', 3500);
  }

  async function api(url, options = {}) {
    const res = await fetch(url, options);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw { status: res.status, data };
    return data;
  }

  function logout() {
    localStorage.removeItem('company_token');
    localStorage.removeItem('current_role');
    window.location.href = '/login';
  }

  function itemCard(html) {
    return `<div class="item">${html}</div>`;
  }

  const savedTheme = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  function updateThemeBtn(t) {
    const b = document.getElementById('themeBtn');
    if (b) b.textContent = t === 'dark' ? '☀ Light mode' : '☽ Dark mode';
  }
  updateThemeBtn(savedTheme);
  function toggleTheme() {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    updateThemeBtn(next);
  }

  const pageMeta = {
    overview: { title: 'Overview', subtitle: 'Your company at a glance.' },
    projects: { title: 'Projects', subtitle: 'Create and manage your internship projects.' },
    shortlist: { title: 'Shortlist', subtitle: 'Review and act on shortlisted students.' },
    reports:  { title: 'Weekly Reports', subtitle: 'View intern progress reports.' }
  };

  function navigate(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
    document.getElementById('nav-' + page).classList.add('active');
    document.getElementById('pageTitle').textContent = pageMeta[page].title;
    document.getElementById('pageSubtitle').textContent = pageMeta[page].subtitle;
    if (page === 'overview') loadOverview();
    if (page === 'projects') loadProjects();
    if (page === 'shortlist') loadShortlist();
    if (page === 'reports') loadReports();
  }

  async function loadOverview() {
    if (!token) { showMsg('Please log in again.', 'error'); return; }
    try {
      const me = await api('/api/company/me', { headers: { ...authHeaders() } });
      document.getElementById('profileBox').innerHTML =
        `<strong>${me.company.company_name}</strong><br>
         Email: ${me.company.email || '—'}<br>
         Website: ${me.company.website || '—'}<br>
         Category: ${me.company.category || '—'}`;
      const [projects, shortlist, reports] = await Promise.all([
        api('/api/company/projects', { headers: { ...authHeaders() } }),
        api('/api/company/shortlist', { headers: { ...authHeaders() } }),
        api('/api/company/weekly-reports', { headers: { ...authHeaders() } })
      ]);
      document.getElementById('countBox').innerHTML =
        `Projects: <strong>${projects.projects.length}</strong><br>
         Shortlists: <strong>${shortlist.shortlist.length}</strong><br>
         Weekly Reports: <strong>${reports.weekly_reports.length}</strong>`;
    } catch (e) {
      showMsg(e.data?.error || 'Failed to load overview', 'error');
    }
  }

  async function loadProjects() {
    const box = document.getElementById('projectsList');
    if (!box) return;
    box.textContent = 'Loading...';
    try {
      const data = await api('/api/company/projects', { headers: { ...authHeaders() } });
      if (!data.projects.length) { box.innerHTML = '<span style="color:var(--muted)">No projects yet.</span>'; return; }
      box.innerHTML = data.projects.map(p => itemCard(
        `<strong>${p.project_name}</strong> <span class="badge">ID ${p.id}</span><br>
         <span style="color:var(--muted);font-size:13px">${p.description || ''}<br>
         Interns: ${p.number_of_interns} &middot; Stipend: ${p.stipend ?? '—'}</span>
         <div class="row" style="margin-top:8px">
           <button class="btn-danger btn-sm" onclick="deleteProject(${p.id})">Delete</button>
         </div>`
      )).join('');
    } catch (e) {
      box.innerHTML = '<span style="color:var(--muted)">Failed to load projects.</span>';
    }
  }

  async function deleteProject(id) {
    if (!confirm('Delete this project?')) return;
    try {
      await api('/api/company/projects/' + id, { method: 'DELETE', headers: { ...authHeaders() } });
      showMsg('Project deleted');
      loadProjects();
    } catch (e) {
      showMsg(e.data?.error || 'Failed to delete project', 'error');
    }
  }

  async function loadShortlist() {
    const box = document.getElementById('shortlistList');
    if (!box) return;
    box.textContent = 'Loading...';
    try {
      const data = await api('/api/company/shortlist', { headers: { ...authHeaders() } });
      if (!data.shortlist.length) { box.innerHTML = '<span style="color:var(--muted)">No shortlisted students yet.</span>'; return; }
      box.innerHTML = data.shortlist.map(s => {
        const st = s.student || {}, p = s.project || {};
        return itemCard(
          `<strong>${st.full_name || 'Student ' + s.student_id}</strong> <span class="badge">${s.status}</span><br>
           <span style="color:var(--muted);font-size:13px">Project: ${p.project_name || s.project_id}<br>Reason: ${s.match_reason || '—'}</span>
           <div class="row" style="margin-top:8px">
             <button class="btn-blue btn-sm" onclick="hireStudent(${s.id})">Hire</button>
             <button class="btn-ghost btn-sm" onclick="scheduleInterview(${s.id})">Schedule Interview</button>
             <button class="btn-danger btn-sm" onclick="rejectStudent(${s.id})">Reject</button>
           </div>`
        );
      }).join('');
    } catch (e) {
      box.innerHTML = '<span style="color:var(--muted)">Failed to load shortlist.</span>';
    }
  }

  async function hireStudent(id) {
    try {
      await api(`/api/company/shortlist/${id}/hire`, { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: '{}' });
      showMsg('Student hired'); loadShortlist();
    } catch (e) { showMsg(e.data?.error || 'Failed to hire student', 'error'); }
  }

  async function rejectStudent(id) {
    const reason = prompt('Reason for rejection:') || '';
    try {
      await api(`/api/company/shortlist/${id}/reject`, { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: JSON.stringify({ reason }) });
      showMsg('Student rejected'); loadShortlist();
    } catch (e) { showMsg(e.data?.error || 'Failed to reject student', 'error'); }
  }

  async function scheduleInterview(id) {
    const dt = prompt('Interview date/time (YYYY-MM-DDTHH:MM)');
    if (!dt) return;
    try {
      await api(`/api/company/shortlist/${id}/interview`, { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: JSON.stringify({ interview_date: dt }) });
      showMsg('Interview scheduled'); loadShortlist();
    } catch (e) { showMsg(e.data?.error || 'Failed to schedule interview', 'error'); }
  }


  async function loadReports() {
    const box = document.getElementById('reportsList');
    if (!box) return;
    box.textContent = 'Loading...';
    try {
      const data = await api('/api/company/weekly-reports', { headers: { ...authHeaders() } });
      if (!data.weekly_reports.length) { box.innerHTML = '<span style="color:var(--muted)">No weekly reports yet.</span>'; return; }
      box.innerHTML = data.weekly_reports.map(r => {
        const st = r.student || {}, p = r.project || {};
        return itemCard(
          `<strong>${st.full_name || 'Student ' + r.student_id}</strong> <span class="badge">${r.status}</span><br>
           <span style="color:var(--muted);font-size:13px">
             Project: ${p.project_name || r.project_id} &middot; Week ${r.week_number}<br>
             ${r.title || '—'} — ${r.description || ''}<br>
             Hours: ${r.hours_worked ?? '—'} &middot; Submitted: ${r.submission_date ? new Date(r.submission_date).toLocaleString() : '—'}
           </span>`
        );
      }).join('');
    } catch (e) {
      box.innerHTML = '<span style="color:var(--muted)">Failed to load reports.</span>';
    }
  }

  document.getElementById('projectForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = {
      project_name: document.getElementById('project_name').value,
      number_of_interns: document.getElementById('number_of_interns').value,
      stipend: document.getElementById('stipend').value,
      description: document.getElementById('description').value,
      details: document.getElementById('details').value,
      place_of_work: document.getElementById('place_of_work').checked,
      international_students: document.getElementById('international_students').checked,
      hired_after: document.getElementById('hired_after').checked,
      covid_vaccination: document.getElementById('covid_vaccination').checked
    };
    try {
      await api('/api/company/projects', { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: JSON.stringify(body) });
      showMsg('Project created');
      document.getElementById('projectForm').reset();
      loadProjects();
    } catch (e) {
      showMsg(e.data?.error || 'Failed to create project', 'error');
    }
  });


  loadOverview();
</script>
</body>
</html>
