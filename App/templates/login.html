<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In · UWI Internship Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #D4A017;
      --gold-light: #F0C040;
      --dark: #F0F4FF;
      --dark2: #FFFFFF;
      --dark3: #E8EFFE;
      --text: #0F1B3D;
      --text-muted: #6B7A99;
      --error: #DC2626;
      --success: #16A34A;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 60% at 10% 0%, rgba(37,99,235,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 90% 100%, rgba(212,160,23,0.06) 0%, transparent 60%);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 24px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 32px;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--gold); }

    .card {
      background: var(--dark2);
      border: 1px solid rgba(139,148,158,0.15);
      border-radius: 16px;
      padding: 40px 36px;
      animation: fadeUp 0.5s ease both;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--gold);
      margin-bottom: 28px;
      display: block;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 32px;
      font-weight: 300;
    }

    
    .role-tabs {
      display: flex;
      gap: 4px;
      background: var(--dark3);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 28px;
    }

    .role-tab {
      flex: 1;
      padding: 8px 4px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .role-tab.active {
      background: var(--dark2);
      color: var(--gold);
      border: 1px solid rgba(201,168,76,0.25);
    }

    
    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 7px;
      letter-spacing: 0.03em;
    }

    input {
      width: 100%;
      padding: 11px 14px;
      background: var(--dark3);
      border: 1px solid rgba(139,148,158,0.2);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    input:focus {
      border-color: #3B82F6;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    input::placeholder { color: rgba(139,148,158,0.5); }

    .submit-btn {
      width: 100%;
      padding: 13px;
      background: var(--gold);
      color: var(--dark);
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }

    .submit-btn:hover {
      background: var(--gold-light);
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(201,168,76,0.25);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .divider {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.82rem;
      margin: 20px 0;
      position: relative;
    }

    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: calc(50% - 20px);
      height: 1px;
      background: rgba(139,148,158,0.15);
    }
    .divider::before { left: 0; }
    .divider::after  { right: 0; }

    .register-link {
      text-align: center;
      font-size: 0.87rem;
      color: var(--text-muted);
    }

    .register-link a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 500;
    }
    .register-link a:hover { text-decoration: underline; }

    
    .alert {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 18px;
      display: none;
    }

    .alert.error {
      background: rgba(248,81,73,0.1);
      border: 1px solid rgba(248,81,73,0.3);
      color: var(--error);
      display: block;
    }

    .alert.success {
      background: rgba(63,185,80,0.1);
      border: 1px solid rgba(63,185,80,0.3);
      color: var(--success);
      display: block;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(13,17,23,0.3);
      border-top-color: var(--dark);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="container">
    <a href="/" class="back-link">← Back to Home</a>

    <div class="card">
      <span class="logo">UWI Internship Portal</span>
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your account to continue</p>

      
      <div class="role-tabs">
        <button class="role-tab active" onclick="setRole('student', this)">🎓 Student</button>
        <button class="role-tab" onclick="setRole('company', this)">🏢 Company</button>
        <button class="role-tab" onclick="setRole('staff', this)">⚙️ Staff</button>
      </div>

      <div id="alert" class="alert"></div>

      <div class="field">
        <label>Email Address</label>
        <input id="email" type="email" placeholder="Enter your email" autocomplete="email"/>
      </div>

      <div class="field">
        <label>Password</label>
        <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password"
          onkeydown="if(event.key==='Enter') doLogin()"/>
      </div>

      <button class="submit-btn" id="loginBtn" onclick="doLogin()">Sign In</button>

      <div class="divider">or</div>

      <div class="register-link" id="registerLinks">
        Don't have an account? <a href="/register/student">Register as Student</a>
      </div>
    </div>
  </div>

<script>
  let currentRole = 'student';

  const roleEndpoints = {
    student: '/api/student/login',
    company: '/api/company/login',
    staff:   '/api/staff/login'
  };

  const roleRedirects = {
    student: '/student/dashboard',
    company: '/company/dashboard',
    staff:   '/staff/dashboard'
  };

  const registerLinksHTML = {
    student: `Don't have an account? <a href="/register/student">Register as Student</a>`,
    company: `Don't have an account? <a href="/register/company">Register your Company</a>`,
    staff:   `Contact your administrator to get access.`
  };

  function setRole(role, btn) {
    currentRole = role;
    document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('registerLinks').innerHTML = registerLinksHTML[role];
    clearAlert();
  }

  function showAlert(msg, type) {
    const el = document.getElementById('alert');
    el.textContent = msg;
    el.className = `alert ${type}`;
  }

  function clearAlert() {
    const el = document.getElementById('alert');
    el.className = 'alert';
    el.textContent = '';
  }

  async function doLogin() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('loginBtn');

    if (!email || !password) {
      showAlert('Please enter your email and password.', 'error');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Signing in…';
    clearAlert();

    try {
      const res = await fetch(roleEndpoints[currentRole], {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!res.ok) {
        showAlert(data.error || 'Invalid credentials. Please try again.', 'error');
        return;
      }

  
      if (data.access_token) {
        localStorage.setItem(`${currentRole}_token`, data.access_token);
        localStorage.setItem('current_role', currentRole);
      }

      showAlert('Login successful! Redirecting…', 'success');
      setTimeout(() => {
        window.location.href = roleRedirects[currentRole];
      }, 800);

    } catch (err) {
      showAlert('Could not connect to the server. Is Flask running?', 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Sign In';
    }
  }
</script>
</body>
</html>
